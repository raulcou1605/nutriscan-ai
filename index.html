<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutriScan AI - Escáner Nutricional Inteligente</title>
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NutriScan">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #059669 0%, #10b981 50%, #34d399 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .pulse-ring { animation: pulse-ring 2s infinite; }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col max-w-md mx-auto shadow-2xl overflow-x-hidden relative">

    <!-- Header / Navbar -->
    <header class="gradient-bg text-white px-6 pt-8 pb-6 rounded-b-3xl shadow-lg relative overflow-hidden">
        <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
        <div class="flex justify-between items-center relative z-10">
            <div>
                <span id="userStatusBadge" class="bg-white/20 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider backdrop-blur-md">Plan Gratuito</span>
                <h1 class="text-3xl font-extrabold mt-1 tracking-tight">NutriScan <span class="text-emerald-200">AI</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="openHistory()" class="w-11 h-11 bg-white/20 hover:bg-white/30 rounded-2xl flex items-center justify-center backdrop-blur-md transition active:scale-95 shadow-sm" title="Historial">
                    <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                </button>
                <button onclick="installPWA()" id="installBtn" class="hidden w-11 h-11 bg-amber-400 text-slate-900 rounded-2xl flex items-center justify-center shadow-md active:scale-95 font-bold" title="Instalar App">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>
        </div>
        
        <!-- Contador de Escaneos -->
        <div class="mt-4 bg-white/10 backdrop-blur-md rounded-2xl p-3 flex justify-between items-center text-xs">
            <span class="text-emerald-100 font-medium"><i class="fa-solid fa-bolt text-amber-300"></i> Escaneos de hoy:</span>
            <span id="scanCounterText" class="font-bold bg-white text-emerald-800 px-2.5 py-0.5 rounded-full">5 restantes</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 px-4 py-6 pb-24 space-y-6">

        <!-- Selector / Cámara Box -->
        <div class="glass-card rounded-3xl p-5 border border-slate-100 shadow-xl relative overflow-hidden">
            <div class="flex flex-col items-center justify-center border-2 border-dashed border-emerald-300 rounded-2xl p-6 bg-emerald-50/50 relative hover:bg-emerald-50 transition group cursor-pointer" onclick="document.getElementById('fileInput').click()">
                <div id="uploadPlaceholder" class="text-center">
                    <div class="w-16 h-16 bg-emerald-500 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg shadow-emerald-500/30 mb-3 group-hover:scale-105 transition transform">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                    <h3 class="font-bold text-slate-700 text-base">Toma una foto o sube imagen</h3>
                    <p class="text-xs text-slate-400 mt-1">Soporta etiquetas de ingredientes, empaques o alimentos</p>
                </div>
                <div id="imagePreviewContainer" class="hidden w-full relative">
                    <img id="imagePreview" src="" alt="Preview" class="w-full h-52 object-cover rounded-xl shadow-inner">
                    <button onclick="event.stopPropagation(); resetUpload();" class="absolute top-2 right-2 bg-slate-900/70 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelect(event)">
            </div>

            <!-- Botones de Ejemplos -->
            <div class="mt-4">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">Prueba con ejemplos rápidos:</span>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="loadPreset('refresco')" class="bg-slate-100 hover:bg-emerald-100 text-slate-700 text-xs font-semibold py-2 px-2 rounded-xl transition text-center border border-slate-200">🥤 Refresco</button>
                    <button onclick="loadPreset('galletas')" class="bg-slate-100 hover:bg-emerald-100 text-slate-700 text-xs font-semibold py-2 px-2 rounded-xl transition text-center border border-slate-200">🍪 Galletas</button>
                    <button onclick="loadPreset('ensalada')" class="bg-slate-100 hover:bg-emerald-100 text-slate-700 text-xs font-semibold py-2 px-2 rounded-xl transition text-center border border-slate-200">🥗 Ensalada</button>
                </div>
            </div>

            <button id="analyzeBtn" onclick="checkScanLimitAndAnalyze()" disabled class="w-full mt-4 bg-slate-200 text-slate-400 font-bold py-3.5 px-4 rounded-2xl shadow-sm transition flex items-center justify-center gap-2 cursor-not-allowed">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Analizar con IA
            </button>
        </div>
